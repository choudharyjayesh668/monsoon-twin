<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monsoon Twin · Flood risk</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/leaflet-velocity.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="app" data-page="flood">
<header class="top">
  <a class="brand" href="index.html">Monsoon Twin</a>
  <div class="status" id="status" role="status"></div>
  <nav aria-label="Pages"><a href="index.html">Forecast</a><a href="twin.html">Climate twin</a><a href="flood.html" aria-current="page">Flood risk</a><a href="how.html">How it works</a><a href="results.html">Results</a></nav>
</header>

<div class="toolbar" role="toolbar" aria-label="Map controls">
  <label class="keep">Weather window <select id="win"></select></label>
  <button class="evobtn primary" id="ev-enter" type="button">Digital twin: evolve ▶</button>
  <span class="evo">
    <label>Change for universe B
      <select id="change">
        <option value="warm_ocean">Warmer Bay of Bengal (+3 °C, +15% moisture)</option>
        <option value="monsoon_stall">Weaker Arabian Sea wind (−40%)</option>
        <option value="arabian_heat">Warmer Arabian Sea (+2.5 °C)</option>
        <option value="custom">Your own change…</option>
      </select>
    </label>
    <span class="custom" id="custom" hidden>
      <label>Where <select id="where"></select></label>
      <label>What <select id="what"></select></label>
      <label>How much <span class="amount"><input type="range" id="amount" aria-label="Amount of the change"><output id="amount-out" for="amount"></output></span></label>
    </span>
    <button class="evobtn" id="ev-apply" type="button">Apply to B now</button>
    <button class="evobtn primary" id="ev-play" type="button">▶ Evolve</button>
    <button class="evobtn" id="ev-reset" type="button">Reset</button>
    <label>Field
      <select id="ev-field">
        <option value="7">Flood risk</option><option value="1">Rain</option><option value="0">Temperature</option>
        <option value="6">Wind speed</option><option value="5">Water vapour</option>
      </select>
    </label>
    <button class="evobtn" id="ev-exit" type="button">Back to forecast</button>
  </span>
  <label>Shock
    <select id="shock">
      <option value="none">No shock</option>
      <option value="warm_ocean">Warmer Bay of Bengal (+3 °C, +15% moisture)</option>
      <option value="monsoon_stall">Weaker Arabian Sea wind (−40%)</option>
      <option value="arabian_heat">Warmer Arabian Sea (+2.5 °C)</option>
    </select>
  </label>
  <input type="hidden" id="field" value="7">
  <div class="seg" role="group" aria-label="View">
    <button data-view="forecast" aria-pressed="true">Forecast</button>
    <button data-view="shock" id="v-shock" aria-pressed="false" disabled>Shock</button>
  </div>
  <div class="dayrow">
    <button class="step" id="prev" aria-label="Previous day" title="Previous day (←)">←</button>
    <span class="daylabel" id="daylabel">Day 1 of 10</span>
    <button class="step" id="next" aria-label="Next day" title="Next day (→)">→</button>
  </div>
  <label class="check"><input type="checkbox" id="wind" checked> Wind flow</label>
</div>

<div class="mapwrap one" id="wrap">
  <div class="pane" id="paneA">
    <div class="maplabel" id="title0">Twin forecast</div>
    <div class="map" id="mapA" role="application" aria-label="Map of the real weather, or of the selected view"></div>
  </div>
  <div class="pane" id="paneB">
    <div class="maplabel" id="title1">Twin forecast</div>
    <div class="map" id="mapB" role="application" aria-label="Map of the twin's forecast"></div>
  </div>

  <div class="card legend">
    <div class="title" id="legtitle"></div>
    <canvas id="bar" width="260" height="8"></canvas>
    <div class="ticks"><span id="lo"></span><span id="hi"></span></div>
  </div>

  <section class="card dock" id="dock" aria-live="polite" aria-label="The selected day in numbers">
    <div class="daytext">
      <div class="eyebrow" id="eyebrow"></div>
      <h2 class="headline" id="headline"></h2>
      <p class="caption" id="captext"></p>
      <div class="stats" id="stats"></div>
    </div>
    <div class="days">
      <div class="tlhead" id="tlhead"></div>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>

  <div class="card tip" id="tip" hidden></div>
  <div class="credit">Borders: <a href="https://github.com/datameet/maps">DataMeet</a> (India, states, CC BY 4.0) ·
    <a href="https://www.naturalearthdata.com">Natural Earth</a> · Population: <a href="https://www.worldpop.org">WorldPop</a> 2011 (CC BY 4.0) · <a href="https://leafletjs.com">Leaflet</a> · leaflet-velocity</div>
</div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet-velocity.min.js"></script>
<script src="data/borders.js"></script>
<script src="data/india.js"></script>
<script src="windows.js"></script>
<script src="data/flood.js"></script>
<script src="data/population.js"></script>
<script src="flood.js"></script>
<script src="twin-builder.js"></script>
<script src="app.js"></script>
<script src="evolve.js"></script>
</body>
</html>
