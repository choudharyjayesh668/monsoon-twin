<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monsoon Twin · Climate twin</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/leaflet-velocity.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="app" data-page="twin">
<header class="top">
  <a class="brand" href="index.html">Monsoon Twin</a>
  <div class="status" id="status" role="status"></div>
  <nav aria-label="Pages"><a href="index.html">Forecast</a><a href="twin.html" aria-current="page">Climate twin</a><a href="flood.html">Flood risk</a><a href="how.html">How it works</a><a href="results.html">Results</a></nav>
</header>

<div class="toolbar" role="toolbar" aria-label="Map controls">
  <label>Starting state <select id="win"></select></label>
  <label>Change to the start
    <select id="change">
      <option value="warm_ocean">Warmer Bay of Bengal (+3 °C, +15% moisture)</option>
      <option value="monsoon_stall">Weaker Arabian Sea wind (−40%)</option>
      <option value="arabian_heat">Warmer Arabian Sea (+2.5 °C)</option>
      <option value="custom">Your own change…</option>
    </select>
  </label>
  <span class="custom" id="custom" hidden>
    <label>Where <select id="where"></select></label>
    <label>What <select id="what"></select></label>
    <label>How much <span class="amount"><input type="range" id="amount" aria-label="Amount of the change"><output id="amount-out" for="amount"></output></span></label>
  </span>
  <label>Field
    <select id="field">
      <option value="1">Rain</option><option value="0">Temperature</option><option value="6">Wind speed</option>
      <option value="5">Water vapour</option><option value="4">Sea-level pressure</option>
    </select>
  </label>
  <div class="seg" role="group" aria-label="View">
    <button data-view="universes" aria-pressed="true">Two universes</button>
    <button data-view="shock" aria-pressed="false">Difference</button>
  </div>
  <div class="dayrow">
    <button class="step" id="prev" aria-label="Previous day" title="Previous day (←)">←</button>
    <span class="daylabel" id="daylabel">Day 1 of 10</span>
    <button class="step" id="next" aria-label="Next day" title="Next day (→)">→</button>
  </div>
  <label class="check"><input type="checkbox" id="wind" checked> Wind flow</label>
</div>

<div class="mapwrap two" id="wrap">
  <div class="pane" id="paneA">
    <div class="maplabel" id="title0">Universe A: as it was</div>
    <div class="map" id="mapA" role="application" aria-label="Map of universe A, or of the difference"></div>
  </div>
  <div class="pane" id="paneB">
    <div class="maplabel" id="title1">Universe B: with the change</div>
    <div class="map" id="mapB" role="application" aria-label="Map of universe B"></div>
  </div>

  <div class="card legend">
    <div class="title" id="legtitle"></div>
    <canvas id="bar" width="260" height="8"></canvas>
    <div class="ticks"><span id="lo"></span><span id="hi"></span></div>
  </div>

  <section class="card dock" id="dock" aria-live="polite" aria-label="The selected day in numbers">
    <div class="daytext">
      <div class="eyebrow" id="eyebrow"></div>
      <h2 class="headline" id="headline"></h2>
      <p class="caption" id="captext"></p>
      <div class="stats" id="stats"></div>
    </div>
    <div class="days">
      <div class="tlhead" id="tlhead"></div>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>

  <div class="card tip" id="tip" hidden></div>
  <div class="credit">Borders: <a href="https://github.com/datameet/maps">DataMeet</a> (India, states, CC BY 4.0) ·
    <a href="https://www.naturalearthdata.com">Natural Earth</a> · <a href="https://leafletjs.com">Leaflet</a> · leaflet-velocity</div>
</div>
<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet-velocity.min.js"></script>
<script src="data/borders.js"></script>
<script src="data/india.js"></script>
<script src="windows.js"></script>
<script src="twin-builder.js"></script>
<script src="app.js"></script>
</body>
</html>
